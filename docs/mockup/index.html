<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동행노트 모바일 목업</title>
  <meta name="description" content="동행노트 모바일 UI 목업. 서버 없이 동작하는 합성 데이터 시연 화면입니다.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="stage">
    <div class="stage-bar">
      <span>UI 목업 · 합성 데이터, 서버 연결 없음</span>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">다크 모드</button>
    </div>

    <div class="phone" id="phone">
      <header class="top">
        <h1>동행노트</h1>
        <span class="chip">합성 데이터 · AI 초안</span>
      </header>

      <main id="screen" class="screen" tabindex="-1"></main>

      <nav class="tabbar" aria-label="주 메뉴">
        <button type="button" data-go="home"><span class="g" aria-hidden="true">◆</span><span>홈</span></button>
        <button type="button" data-go="result"><span class="g" aria-hidden="true">▤</span><span>상담</span></button>
        <button type="button" data-go="check"><span class="g" aria-hidden="true">☑</span><span>확인 필요</span></button>
        <button type="button" data-go="approve"><span class="g" aria-hidden="true">▦</span><span>문서</span></button>
        <button type="button" data-go="eval"><span class="g" aria-hidden="true">◷</span><span>평가</span></button>
      </nav>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
